name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/unscattered-app-build-9xhglz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # VITE_CLASSIFY_ENDPOINT is optional — Vite bakes it in at build
        # time. Unset (the default, since no such secret exists until you
        # add one), this resolves to an empty string, which the app treats
        # exactly like "not configured": no network call, heuristic
        # classifier only. See server-example/README.md to opt in.
        run: npm run build
        env:
          VITE_CLASSIFY_ENDPOINT: ${{ secrets.VITE_CLASSIFY_ENDPOINT }}

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
